
name: Build Elemental Staff

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: unzip -o ElementalStaff-Fabric-1.21.11-Destructive-Source.jar -d .

      - name: Compile mod
        run: gradle -p ElementalStaff build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: ElementalStaff-JAR
          path: ElementalStaff/build/libs/elemental-staff-1.0.0.jar
